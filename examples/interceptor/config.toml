[component.greeter]
uri = "./lib/greeter.wasm"
interceptors = ["logging-advice"]

[component.logging-advice]
uri = "./lib/logger.wasm"
imports = ["stderr-logger"]

[component.stderr-logger]
uri = "oci://ghcr.io/componentized/logging/to-stderr:0.3.1"
imports = ["cli", "clocks"]

[capability.cli]
type = "wasi:cli"
inherit-stderr = true

[capability.clocks]
type = "wasi:clocks"
